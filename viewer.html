<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>每日AI与金融速报</title>
  <style>
    /* ── 基础 ── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", sans-serif;
      background: #f3eee8;
      color: #3d3d3d;
      min-height: 100vh;
    }
    .container { max-width: 900px; margin: 0 auto; padding: 20px 16px 60px; }

    /* ── 顶部 Header ── */
    .header {
      text-align: center;
      padding: 30px 20px;
      background: linear-gradient(135deg, #8a7a6a 0%, #6a5a4a 100%);
      border-radius: 16px;
      margin-bottom: 20px;
      color: white;
      position: relative;
    }
    .back-btn {
      position: absolute;
      left: 20px;
      top: 50%;
      transform: translateY(-50%);
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 8px 16px;
      background: rgba(255,255,255,0.15);
      border: 1px solid rgba(255,255,255,0.25);
      border-radius: 10px;
      color: white;
      text-decoration: none;
      font-size: 14px;
      backdrop-filter: blur(8px);
      cursor: pointer;
      transition: background 0.2s;
    }
    .back-btn:hover { background: rgba(255,255,255,0.28); }
    .header h1 { font-size: 26px; font-weight: 600; margin-bottom: 8px; }
    .header .date { font-size: 15px; opacity: 0.85; }

    /* ── Tabs ── */
    .tabs {
      display: flex;
      background: rgba(255,255,255,0.65);
      backdrop-filter: blur(12px);
      border-radius: 14px;
      padding: 4px;
      margin-bottom: 16px;
      box-shadow: 0 1px 6px rgba(0,0,0,0.07);
      position: sticky;
      top: 8px;
      z-index: 10;
    }
    .tab-btn {
      flex: 1;
      padding: 10px;
      border: none;
      background: transparent;
      border-radius: 11px;
      font-size: 15px;
      font-weight: 500;
      color: #888;
      cursor: pointer;
      transition: all 0.2s;
    }
    .tab-btn.active {
      background: white;
      color: #3d3d3d;
      box-shadow: 0 2px 8px rgba(0,0,0,0.10);
    }
    .tab-badge {
      display: inline-block;
      font-size: 12px;
      font-weight: 700;
      padding: 1px 7px;
      border-radius: 20px;
      margin-left: 5px;
      vertical-align: middle;
      line-height: 1.6;
    }
    #tabAi .tab-badge { background: #f5ece1; color: #b48250; }
    #tabAi.active .tab-badge { background: #f5ece1; color: #b48250; }
    #tabFn .tab-badge { background: #e4f2ef; color: #3a7a68; }
    #tabFn.active .tab-badge { background: #e4f2ef; color: #3a7a68; }

    /* ── 筛选条 ── */
    .filter-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 14px;
    }
    .filter-btn {
      padding: 5px 14px;
      border-radius: 20px;
      border: 1.5px solid #d0c8c0;
      background: white;
      font-size: 13px;
      color: #7a7068;
      cursor: pointer;
      transition: all 0.15s;
    }
    .filter-btn.active {
      color: white;
      border-color: transparent;
    }
    /* AI 层颜色 */
    .filter-btn[data-layer="foundation"].active { background: #b48250; }
    .filter-btn[data-layer="tools"].active       { background: #5a9b8c; }
    .filter-btn[data-layer="application"].active  { background: #96786e; }
    .filter-btn[data-layer="governance"].active   { background: #aa9664; }
    /* 金融层颜色 */
    .filter-btn[data-layer="macro"].active   { background: #5082aa; }
    .filter-btn[data-layer="market"].active  { background: #b45a46; }
    .filter-btn[data-layer="micro"].active   { background: #649650; }
    .filter-btn[data-layer="risk"].active    { background: #be5050; }
    .filter-btn[data-layer="insight"].active { background: #826eaa; }
    /* 全部按钮 active */
    .filter-btn[data-layer="all"].active { background: #7a7068; }

    /* ── 新闻卡片 ── */
    .news-list { display: flex; flex-direction: column; gap: 12px; }
    .news-card {
      background: white;
      border-radius: 14px;
      padding: 16px 18px;
      box-shadow: 0 1px 6px rgba(0,0,0,0.06);
      border-left: 4px solid #e0d8d0;
      transition: box-shadow 0.2s;
    }
    .news-card:hover { box-shadow: 0 4px 16px rgba(0,0,0,0.10); }

    /* 层级边框颜色 - AI */
    .news-card.layer-foundation { border-left-color: #b48250; }
    .news-card.layer-tools       { border-left-color: #5a9b8c; }
    .news-card.layer-application { border-left-color: #96786e; }
    .news-card.layer-governance  { border-left-color: #aa9664; }
    /* 层级边框颜色 - 金融 */
    .news-card.layer-macro   { border-left-color: #5082aa; }
    .news-card.layer-market  { border-left-color: #b45a46; }
    .news-card.layer-micro   { border-left-color: #649650; }
    .news-card.layer-risk    { border-left-color: #be5050; }
    .news-card.layer-insight { border-left-color: #826eaa; }

    .card-header {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      margin-bottom: 8px;
    }
    .rank-badge {
      min-width: 28px;
      height: 28px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      font-weight: 700;
      color: white;
      flex-shrink: 0;
    }
    /* Top3 渐变圆角方块 */
    .rank-1 { background: linear-gradient(135deg, #d4a054, #b8804a); }
    .rank-2 { background: linear-gradient(135deg, #b0b0b0, #909090); }
    .rank-3 { background: linear-gradient(135deg, #c08060, #a06040); }
    .rank-other { background: #c8c0b8; font-size: 12px; }

    .card-title {
      font-size: 15px;
      font-weight: 600;
      line-height: 1.4;
      color: #2d2d2d;
      flex: 1;
    }
    .card-summary {
      font-size: 13.5px;
      line-height: 1.65;
      color: #5a5550;
      margin-bottom: 10px;
    }
    .card-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 6px;
    }
    .tag-list { display: flex; flex-wrap: wrap; gap: 5px; }
    .layer-tag, .tag {
      display: inline-block;
      padding: 2px 10px;
      border-radius: 12px;
      font-size: 12px;
      font-weight: 500;
    }
    .layer-tag {
      color: white;
    }
    /* layer-tag 颜色 - AI */
    .lt-foundation { background: #b48250; }
    .lt-tools       { background: #5a9b8c; }
    .lt-application { background: #96786e; }
    .lt-governance  { background: #aa9664; }
    /* layer-tag 颜色 - 金融 */
    .lt-macro   { background: #5082aa; }
    .lt-market  { background: #b45a46; }
    .lt-micro   { background: #649650; }
    .lt-risk    { background: #be5050; }
    .lt-insight { background: #826eaa; }

    .tag { background: #f0ebe4; color: #7a7068; }
    .source-link {
      font-size: 12px;
      color: #5a9b8c;
      text-decoration: none;
      opacity: 0.8;
      white-space: nowrap;
    }
    .source-link:hover { opacity: 1; text-decoration: underline; }

    /* ── 加载状态 ── */
    .loading { text-align: center; padding: 80px 20px; color: #999; font-size: 16px; }
    .error { text-align: center; padding: 80px 20px; color: #be5050; font-size: 15px; }
    .empty { text-align: center; padding: 40px; color: #aaa; font-size: 14px; }

    /* ── 底部注释 ── */
    .footer { text-align: center; margin-top: 30px; font-size: 12px; color: #b0a898; }
  </style>
</head>
<body>
<div class="container">
  <!-- 顶部 Header -->
  <div class="header">
    <a class="back-btn" onclick="window.location.href='index.html'">← 归档首页</a>
    <h1>📰 每日AI与金融速报</h1>
    <div class="date" id="headerDate">加载中...</div>
  </div>

  <!-- Tabs -->
  <div class="tabs">
    <button class="tab-btn active" id="tabAi" onclick="switchTab('ai')">🤖 AI大事<span class="tab-badge" id="aiCount">—</span></button>
    <button class="tab-btn" id="tabFn" onclick="switchTab('finance')">💰 金融大事<span class="tab-badge" id="fnCount">—</span></button>
  </div>

  <!-- 筛选栏 -->
  <div class="filter-bar" id="filterBar"></div>

  <!-- 内容区 -->
  <div id="content">
    <div class="loading">正在加载速报数据...</div>
  </div>

  <div class="footer">📌 本速报由 AI 自动生成，信息来源于公开渠道，仅供参考</div>
</div>

<script>
// ── 配置 ──
const AI_FILTERS = [
  { layer: 'all',         label: '全部' },
  { layer: 'foundation',  label: '🏗️ 底座' },
  { layer: 'tools',       label: '🔧 工具' },
  { layer: 'application', label: '🚀 应用' },
  { layer: 'governance',  label: '⚖️ 治理' },
];
const FN_FILTERS = [
  { layer: 'all',     label: '全部' },
  { layer: 'macro',   label: '🌐 宏观' },
  { layer: 'market',  label: '📈 行情' },
  { layer: 'micro',   label: '🏢 微观' },
  { layer: 'risk',    label: '⚠️ 风险' },
  { layer: 'insight', label: '🔍 观点' },
];

let currentTab = 'ai';
let currentFilter = 'all';
let digestData = null;

// ── 获取当前日期参数 ──
function getDateParam() {
  const params = new URLSearchParams(window.location.search);
  return params.get('date');
}

// ── 格式化日期 ──
function formatDate(dateStr) {
  const d = new Date(dateStr + 'T00:00:00');
  const weekdays = ['日','一','二','三','四','五','六'];
  return `${d.getFullYear()}年${d.getMonth()+1}月${d.getDate()}日（周${weekdays[d.getDay()]}）`;
}

// ── 加载数据 ──
async function loadData(date) {
  try {
    const res = await fetch(`data/${date}.json?_=${Date.now()}`);
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    digestData = await res.json();

    document.getElementById('headerDate').textContent = formatDate(date);
    document.getElementById('aiCount').textContent = digestData.aiCount;
    document.getElementById('fnCount').textContent = digestData.fnCount;

    renderFilters();
    renderItems();
  } catch (e) {
    document.getElementById('content').innerHTML = `<div class="error">❌ 加载失败：${e.message}<br><small>日期：${date}</small></div>`;
    document.getElementById('headerDate').textContent = date;
  }
}

// ── 渲染筛选按钮 ──
function renderFilters() {
  const filters = currentTab === 'ai' ? AI_FILTERS : FN_FILTERS;
  const bar = document.getElementById('filterBar');
  bar.innerHTML = filters.map(f => `
    <button class="filter-btn${currentFilter === f.layer ? ' active' : ''}"
      data-layer="${f.layer}"
      onclick="setFilter('${f.layer}')">${f.label}</button>
  `).join('');
}

// ── 渲染新闻列表 ──
function renderItems() {
  if (!digestData) return;
  const items = currentTab === 'ai' ? digestData.ai : digestData.finance;
  const filtered = currentFilter === 'all' ? items : items.filter(i => i.layer === currentFilter);

  const el = document.getElementById('content');
  if (!filtered || filtered.length === 0) {
    el.innerHTML = '<div class="empty">该分类暂无数据</div>';
    return;
  }

  el.innerHTML = `<div class="news-list">${filtered.map(item => renderCard(item)).join('')}</div>`;
}

// ── 渲染单条卡片 ──
function renderCard(item) {
  const rankClass = item.rank <= 3 ? `rank-${item.rank}` : 'rank-other';
  const tagHtml = item.tags.map(t => `<span class="tag">${t}</span>`).join('');
  const sourceHtml = item.source
    ? `<a class="source-link" href="${item.source}" target="_blank" rel="noopener">查看原文 ↗</a>`
    : '';
  return `
    <div class="news-card layer-${item.layer}">
      <div class="card-header">
        <span class="rank-badge ${rankClass}">${item.rank}</span>
        <div class="card-title">${item.title}</div>
      </div>
      <div class="card-summary">${item.summary}</div>
      <div class="card-footer">
        <div class="tag-list">
          <span class="layer-tag lt-${item.layer}">${item.layerLabel}</span>
          ${tagHtml}
        </div>
        ${sourceHtml}
      </div>
    </div>`;
}

// ── 切换 Tab ──
function switchTab(tab) {
  currentTab = tab;
  currentFilter = 'all';
  document.getElementById('tabAi').classList.toggle('active', tab === 'ai');
  document.getElementById('tabFn').classList.toggle('active', tab === 'finance');
  renderFilters();
  renderItems();
}

// ── 切换筛选 ──
function setFilter(layer) {
  currentFilter = layer;
  renderFilters();
  renderItems();
}

// ── 初始化 ──
const date = getDateParam();
if (date) {
  loadData(date);
} else {
  document.getElementById('content').innerHTML = '<div class="error">❌ 未指定日期，请从<a href="index.html">归档首页</a>进入。</div>';
  document.getElementById('headerDate').textContent = '未知日期';
}
</script>
</body>
</html>
